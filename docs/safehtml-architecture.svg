<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334159"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="860" height="640" fill="#f8fafc" rx="12"/>

  <text x="430" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">SafeHTML Sanitizer Architecture</text>
  <text x="430" y="72" text-anchor="middle" font-size="13" fill="#647489">Educational HTML sanitizer for Java 21 + jsoup</text>

  <!-- Input -->
  <g transform="translate(60, 100)">
    <rect width="200" height="52" fill="#1e293b" rx="8" filter="url(#shadow)"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Untrusted HTML</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#cbd5e1">User input</text>
  </g>

  <path d="M160,158 L160,170" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parser -->
  <g transform="translate(60, 180)">
    <rect width="200" height="56" fill="#fff" stroke="#e2e8f0" rx="8" filter="url(#shadow)"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">jsoup HTML parser</text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#475569">Jsoup.parseBodyFragment(html)</text>
    <text x="100" y="54" text-anchor="middle" font-size="10" fill="#94a3b8">DOM tree, no regex</text>
  </g>

  <path d="M260,210 L300,210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">policy</text>
  <path d="M300,203 L300,275" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Core sanitizer + policy + url validator -->
  <g transform="translate(340, 190)">
    <rect width="220" height="175" fill="#fff" stroke="#e2e8f0" rx="8" filter="url(#shadow)"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">SafeHtmlSanitizer</text>
    <text x="14" y="44" font-size="10" fill="#647489">1. Element allowlist</text>
    <text x="14" y="60" font-size="10" fill="#647489">2. Attribute filtering</text>
    <text x="14" y="76" font-size="10" fill="#647489">3. Strip event handlers (on*)</text>
    <text x="14" y="92" font-size="10" fill="#647489">4. URL validation</text>
    <text x="14" y="108" font-size="10" fill="#647489">5. Comment removal</text>
    <text x="14" y="124" font-size="10" fill="#647489">6. Serialize to HTML</text>
    <text x="14" y="144" font-size="10" fill="#647489">Report: SecurityReport</text>
  </g>

  <!-- Policy box -->
  <g transform="translate(340, 380)">
    <rect width="220" height="110" fill="#f8fafc" stroke="#e2e8f0" rx="8" filter="url(#shadow)"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">SanitizationPolicy</text>
    <text x="110" y="44" text-anchor="middle" font-size="10" fill="#475569">allowed elements</text>
    <text x="110" y="60" text-anchor="middle" font-size="10" fill="#475569">allowed attributes</text>
    <text x="110" y="76" text-anchor="middle" font-size="10" fill="#475569">allowed protocols</text>
    <text x="110" y="92" text-anchor="middle" font-size="9" fill="#94a3b8">builder API + default policy</text>
  </g>

  <!-- UrlValidator box -->
  <g transform="translate(580, 190)">
    <rect width="200" height="110" fill="#fff" stroke="#e2e8f0" rx="8" filter="url(#shadow)"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">UrlValidator</text>
    <text x="100" y="44" text-anchor="middle" font-size="10" fill="#475569">Scheme extraction</text>
    <text x="100" y="60" text-anchor="middle" font-size="10" fill="#475569">Protocol allowlist</text>
    <text x="100" y="76" text-anchor="middle" font-size="10" fill="#475569">Case-insensitive</text>
    <text x="100" y="92" text-anchor="middle" font-size="10" fill="#475569">Whitespace-safe</text>
  </g>

  <!-- Output: Sanitized HTML -->
  <g transform="translate(580, 330)">
    <rect width="200" height="72" fill="#f0fdf4" stroke="#86efac" rx="8" filter="url(#shadow)"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Sanitized HTML</text>
    <text x="100" y="44" text-anchor="middle" font-size="10" fill="#15803d" font-family="'SFMono-Regular', Consolas, monospace">&lt;p&gt;Hello&lt;/p&gt;</text>
    <text x="100" y="60" text-anchor="middle" font-size="10" fill="#166534">Safe to render</text>
  </g>

  <!-- Output: Security Report -->
  <g transform="translate(580, 430)">
    <rect width="200" height="160" fill="#fff" stroke="#e2e8f0" rx="8" filter="url(#shadow)"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">SecurityReport</text>
    <text x="100" y="44" text-anchor="middle" font-size="10" fill="#475569">Removed elements</text>
    <text x="100" y="60" text-anchor="middle" font-size="10" fill="#475565">Removed attributes</text>
    <text x="100" y="76" text-anchor="middle" font-size="10" fill="#475565">Blocked URLs</text>
    <text x="100" y="92" text-anchor="middle" font-size="10" fill="#475565">Removed comments</text>
    <text x="100" y="108" text-anchor="middle" font-size="10" fill="#647489">total: totalModifications()</text>
    <text x="100" y="140" text-anchor="middle" font-size="9" fill="#94a3b8">Immutable &amp; thread-safe</text>
  </g>

  <!-- Arrow from sanitizer to outputs -->
  <path d="M460,235 L520,280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M460,265 L520,360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="430" y="610" text-anchor="middle" font-size="10" fill="#94a3b8">Educational project — not production-ready. See SECURITY.md for threat model.</text>
</svg>
